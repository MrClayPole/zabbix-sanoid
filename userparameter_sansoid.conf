# /etc/zabbix/zabbix_agentd.d/sanoid.conf
#
# UserParameters for monitoring sanoid via its --monitor-* modes.
# Each key returns sanoid's full Nagios-style text output, e.g.:
#   OK: all monitored datasets have fresh snapshots
#   WARN: tank/data newest hourly snapshot is 2h 15m old (should be < 1h 30m)
#   CRIT: tank/data has no snapshots at all
#
# Triggers in the Zabbix template match the leading OK/WARN/CRIT keyword,
# so no separate exit-code item is needed and sanoid runs only once per check.
#
# Prerequisites:
#   1. Adjust the path below if sanoid lives elsewhere (check: which sanoid).
#   2. sanoid needs root to read ZFS, so the zabbix user runs it via sudo.
#      Create /etc/sudoers.d/zabbix-sanoid containing:
#
#        zabbix ALL=(root) NOPASSWD: /usr/sbin/sanoid --monitor-snapshots, \
#                                    /usr/sbin/sanoid --monitor-capacity, \
#                                    /usr/sbin/sanoid --monitor-health
#
#      and: chmod 0440 /etc/sudoers.d/zabbix-sanoid
#   3. Restart the agent:  systemctl restart zabbix-agent
#
# Test from the host:
#   zabbix_agentd -t sanoid.monitor.snapshots.text
#   sudo -u zabbix sudo /usr/sbin/sanoid --monitor-snapshots
 
UserParameter=sanoid.monitor.snapshots.text,sudo /usr/sbin/sanoid --monitor-snapshots 2>&1
UserParameter=sanoid.monitor.capacity.text,sudo /usr/sbin/sanoid --monitor-capacity 2>&1
UserParameter=sanoid.monitor.health.text,sudo /usr/sbin/sanoid --monitor-health 2>&1